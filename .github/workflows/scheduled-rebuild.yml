# Rebuilds the Netlify site weekly so date-based content stays current without a code change:
# "Present" role durations, reading list freshness, and certification status (CPACC switches to "held through" after it expires).
#
# Setup: Netlify > Site configuration > Build & deploy > Build hooks > Add build hook,
# then save its URL as the NETLIFY_BUILD_HOOK repository secret in GitHub.
name: Scheduled rebuild

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
